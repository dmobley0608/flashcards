version: "3.8"

services:
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3007:3007"
    environment:
      - VITE_API_URL=http://backend:4000
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    volumes:
      - sqlite_data:/app/data
    depends_on:
      - init-db

  init-db:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: npx prisma migrate deploy
    environment:
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
